<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginPage" class="box hidden">
  <h2>🔐 管理后台登录</h2>
  <div id="loginErr" class="msg err"></div>
  <input type="password" id="pwd" placeholder="请输入后台密码" required autofocus>
  <button onclick="doLogin()">登录</button>
</div>

<div id="adminPage" class="container hidden">
  <div class="header">
    <h2>📦 设备管理后台</h2>
    <button class="logout" onclick="doLogout()">退出</button>
  </div>
  <div id="msg" class="msg"></div>
  <div class="add-form">
    <input id="add-sn" placeholder="序列号" required>
    <input id="add-model" placeholder="设备型号" required>
    <input type="date" id="add-act" required>
    <button onclick="addDevice()">➕ 添加</button>
  </div>
  <table>
    <thead><tr><th>ID</th><th>序列号</th><th>型号</th><th>激活</th><th>保修截止</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>
<script src="app.js"></script>
<script>
const token=getToken();
if(token){showAdmin();}else{showLogin();}

document.getElementById('pwd').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});

async function doLogin(){
  const pwd=document.getElementById('pwd').value;
  const res=await post('/api/login',{pwd});
  if(!res.ok){document.getElementById('loginErr').textContent=res.error||'登录失败';return;}
  setToken(res.token);
  document.getElementById('pwd').value='';
  showAdmin();
}
function doLogout(){
  post('/api/logout',{});
  clearToken();
  document.getElementById('list').innerHTML='';
  showLogin();
}
async function showAdmin(){
  show('adminPage');hide('loginPage');
  const res=await authGet('/api/devices');
  if(!res.ok){clearToken();showLogin();return;}
  render(res.data);
}
function showLogin(){show('loginPage');hide('adminPage');}
function render(rows){
  const tb=document.getElementById('list');tb.innerHTML='';
  rows.forEach(d=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+d.id+'</td>'+
      '<td>'+esc(d.serial_number)+'</td>'+
      '<td>'+esc(d.model)+'</td>'+
      '<td>'+d.activate_time+'</td>'+
      '<td>'+d.warranty_end+'</td>'+
      '<td>'+(d.in_warranty?'✅ 在保':'❌ 过保')+'</td>'+
      '<td><a class="del" onclick="delDevice('+d.id+')">删除</a></td>';
    tb.appendChild(tr);
  });
}
async function addDevice(){
  const sn=val('add-sn'),model=val('add-model'),activate_time=val('add-act');
  if(!sn||!model||!activate_time){showMsg('请填写完整');return;}
  const res=await authPost('/api/devices',{sn,model,activate_time});
  if(res.ok){showMsg('添加成功');valClear(['add-sn','add-model','add-act']);showAdmin();}
  else showMsg(res.error||'添加失败');
}
async function delDevice(id){
  if(!confirm('确定删除？'))return;
  const res=await authFetch('/api/devices?id='+id,{method:'DELETE'});
  if(res.ok){showMsg('已删除');showAdmin();}
}
</script>
</body>
</html>
