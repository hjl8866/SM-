<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - SN Query</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1100px; margin: 0 auto; }
.header {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  padding: 20px 30px;
  border-radius: 12px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 { font-size: 20px; }
.header a, .header button {
  color: #fff; background: rgba(255,255,255,0.2); border: none;
  padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px;
}
.header a:hover, .header button:hover { background: rgba(255,255,255,0.3); }

/* 登录页 */
.login-card {
  background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  padding: 40px; max-width: 400px; margin: 100px auto;
}
.login-card h2 { text-align: center; margin-bottom: 25px; color: #333; }
.login-card input {
  width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 10px;
  font-size: 16px; margin-bottom: 15px; outline: none;
}
.login-card input:focus { border-color: #667eea; }
.login-card button {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 600;
}

/* 主面板 */
.panel { display: none; }
.panel.active { display: block; }

/* 卡片 */
.card {
  background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.card h3 { color: #333; margin-bottom: 15px; font-size: 18px; }

/* 表单 */
.form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.form-row input, .form-row select {
  flex: 1; min-width: 150px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 14px; outline: none;
}
.form-row input:focus, .form-row select:focus { border-color: #667eea; }
.btn {
  padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
}
.btn-primary { background: #667eea; color: #fff; }
.btn-success { background: #28a745; color: #fff; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-warning { background: #ffc107; color: #333; }
.btn:hover { opacity: 0.9; }

/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #f8f9fa; font-weight: 600; color: #555; }
tr:hover { background: #f8f9fa; }
.badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge.ok { background: #dcfce7; color: #16a34a; }
.badge.no { background: #fef2f2; color: #dc2626; }

/* Tab */
.tab-bar { display: flex; gap: 0; margin-bottom: 20px; }
.tab-bar button {
  padding: 12px 24px; border: none; cursor: pointer; font-size: 14px; font-weight: 600;
  background: #e5e7eb; color: #666;
}
.tab-bar button.active { background: #667eea; color: #fff; }
.tab-bar button:first-child { border-radius: 8px 0 0 8px; }
.tab-bar button:last-child { border-radius: 0 8px 8px 0; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* 批量导入区 */
.import-zone {
  border: 2px dashed #667eea; border-radius: 12px; padding: 25px; background: #f8f9ff;
  margin-bottom: 20px;
}
.import-zone h4 { color: #333; margin-bottom: 10px; }
.import-zone p { color: #666; font-size: 13px; margin-bottom: 12px; }

/* 文件输入 */
.file-input {
  width: 100%; padding: 12px; border: 2px dashed #d1d5db; border-radius: 8px;
  margin-bottom: 10px; cursor: pointer; font-size: 14px;
}

/* 弹窗 */
.modal-overlay {
  display: none; position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px;
}
.modal h3 { margin-bottom: 20px; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 14px 24px; border-radius: 8px; color: #fff; font-weight: 600;
  z-index: 2000; display: none;
}
.toast.show { display: block; }
.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }

@media (max-width: 768px) {
  .form-row { flex-direction: column; }
  .header { flex-direction: column; gap: 10px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- 登录页 -->
  <div id="loginPanel" class="panel active">
    <div class="login-card">
      <h2>🔐 管理后台登录</h2>
      <input type="password" id="pwdInput" placeholder="请输入密码" onkeypress="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()">登 录</button>
      <p id="loginError" style="color:#dc2626; margin-top:10px; text-align:center; display:none;">密码错误</p>
    </div>
  </div>

  <!-- 主面板 -->
  <div id="mainPanel" class="panel">
    <div class="header">
      <h1>🔧 SN Query 管理后台</h1>
      <div>
        <a href="index.html">🏠 查询页</a>
        <button onclick="doLogout()" style="margin-left:10px;">退出登录</button>
      </div>
    </div>

    <!-- Tab切换 -->
    <div class="tab-bar">
      <button id="tabDevices" class="active" onclick="switchTab('devices')">📱 设备管理</button>
      <button id="tabImport" onclick="switchTab('import')">📦 批量导入</button>
    </div>

    <!-- 设备管理 Tab -->
    <div id="devicesTab" class="tab-content active">
      <div class="card">
        <h3>➕ 添加设备</h3>
        <div class="form-row">
          <input type="text" id="addSn" placeholder="序列号（如 F2LXV5KQ）">
          <input type="text" id="addModel" placeholder="型号（如 iPhone 15 Pro）">
          <input type="date" id="addDate">
          <button class="btn btn-primary" onclick="addDevice()">添加</button>
        </div>
      </div>

      <div class="card">
        <h3>📋 设备列表</h3>
        <div style="margin-bottom:10px;">
          <button class="btn btn-danger" onclick="clearAllDevices()" style="font-size:12px;">清空全部</button>
        </div>
        <div style="overflow-x:auto;">
          <table id="deviceTable">
            <thead>
              <tr><th>ID</th><th>序列号</th><th>型号</th><th>激活时间</th><th>保修截止</th><th>操作</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 批量导入 Tab -->
    <div id="importTab" class="tab-content">
      <div class="import-zone">
        <h4>📦 批量导入设备</h4>
        <div class="tab-bar" style="margin-bottom:15px;">
          <button id="importTabOcr" class="active" onclick="switchImportTab('ocr')" style="border-radius:8px 0 0 8px;">📷 OCR拍照识别</button>
          <button id="importTabCsv" onclick="switchImportTab('csv')" style="border-radius:0 8px 8px 0;">📋 表格/CSV导入</button>
        </div>

        <!-- OCR -->
        <div id="importOcrPanel">
          <p>上传设备标签照片，自动识别序列号。手写识别率约85%，请核对后提交。</p>
          <input type="file" class="file-input" id="ocrFiles" multiple accept="image/*" onchange="handleOcrFiles(event)">
          <div id="ocrLoading" style="display:none; color:#667eea; padding:10px;">🔍 识别中，请稍候...（首次加载语言包约10秒）</div>
          <div id="ocrResults"></div>
          <button class="btn btn-success" onclick="submitBatchOcr()" id="submitOcrBtn" style="display:none; margin-top:15px;">✅ 确认提交到数据库</button>
        </div>

        <!-- CSV -->
        <div id="importCsvPanel" style="display:none;">
          <p>格式：序列号,型号,激活时间(YYYY-MM-DD)，每行一个，或从Excel复制粘贴</p>
          <textarea id="csvInput" rows="8" placeholder="F2LXV5KQ,iPhone 15 Pro,2025-01-15&#10;G8KM3P2R,iPhone 14,2024-11-03" style="width:100%; padding:12px; border:1px solid #d1d5db; border-radius:8px; font-family:monospace; font-size:14px; resize:vertical;"></textarea>
          <br><br>
          <button class="btn btn-primary" onclick="parseCsvImport()">📥 解析预览</button>
          <div id="csvPreview"></div>
          <button class="btn btn-success" onclick="submitCsvImport()" id="submitCsvBtn" style="display:none; margin-top:15px;">✅ 确认提交到数据库</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
// ===== 工具 =====
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type || 'success');
  setTimeout(() => t.className = 'toast', 3000);
}
function getToken() { return localStorage.getItem('admin_token'); }
function escapeHtml(text) {
  const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

// ===== 登录 =====
async function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  const err = document.getElementById('loginError');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pwd })
    });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('admin_token', data.token);
      document.getElementById('loginPanel').classList.remove('active');
      document.getElementById('mainPanel').classList.add('active');
      err.style.display = 'none';
      loadDevices();
    } else {
      err.style.display = 'block';
    }
  } catch(e) {
    err.style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('admin_token');
  location.reload();
}

// 检查登录状态
if (getToken()) {
  document.getElementById('loginPanel').classList.remove('active');
  document.getElementById('mainPanel').classList.add('active');
  loadDevices();
}
