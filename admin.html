<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - SN Query</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f2f5; min-height: 100vh; padding: 20px;
}
.container { max-width: 1000px; margin: 0 auto; }
.header {
  background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  padding: 20px 30px; border-radius: 12px; margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center;
}
.header h1 { font-size: 20px; }
.header a, .header button {
  color: #fff; background: rgba(255,255,255,0.2); border: none;
  padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px;
}
.login-card {
  background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  padding: 40px; max-width: 400px; margin: 100px auto;
}
.login-card h2 { text-align: center; margin-bottom: 25px; color: #333; }
.login-card input {
  width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 10px;
  font-size: 16px; margin-bottom: 15px; outline: none;
}
.login-card button {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 600;
}
.panel { display: none; }
.panel.active { display: block; }
.card {
  background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.card h3 { color: #333; margin-bottom: 15px; font-size: 18px; }
.form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.form-row input {
  flex: 1; min-width: 150px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 14px; outline: none;
}
.btn {
  padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
}
.btn-primary { background: #667eea; color: #fff; }
.btn-success { background: #28a745; color: #fff; }
.btn-danger { background: #dc3545; color: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #f8f9fa; font-weight: 600; color: #555; }
.badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge.ok { background: #dcfce7; color: #16a34a; }
.badge.no { background: #fef2f2; color: #dc2626; }
.tab-bar { display: flex; gap: 0; margin-bottom: 20px; }
.tab-bar button {
  padding: 12px 24px; border: none; cursor: pointer; font-size: 14px; font-weight: 600;
  background: #e5e7eb; color: #666;
}
.tab-bar button.active { background: #667eea; color: #fff; }
.tab-bar button:first-child { border-radius: 8px 0 0 8px; }
.tab-bar button:last-child { border-radius: 0 8px 8px 0; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 14px 24px; border-radius: 8px; color: #fff; font-weight: 600;
  z-index: 2000; display: none;
}
.toast.show { display: block; }
.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }
</style>
</head>
<body>
<div class="container">
  <div id="loginPanel" class="panel active">
    <div class="login-card">
      <h2>🔐 管理后台登录</h2>
      <input type="password" id="pwdInput" placeholder="请输入密码" onkeypress="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()">登 录</button>
      <p id="loginError" style="color:#dc2626; margin-top:10px; text-align:center; display:none;">密码错误</p>
    </div>
  </div>

  <div id="mainPanel" class="panel">
    <div class="header">
      <h1>🔧 SN Query 管理后台</h1>
      <div>
        <a href="index.html">🏠 查询页</a>
        <button onclick="doLogout()" style="margin-left:10px;">退出登录</button>
      </div>
    </div>

    <div class="tab-bar">
      <button id="tabDevices" class="active" onclick="switchTab('devices')">📱 设备管理</button>
      <button id="tabImport" onclick="switchTab('import')">📦 批量导入</button>
    </div>

    <div id="devicesTab" class="tab-content active">
      <div class="card">
        <h3>➕ 添加设备</h3>
        <div class="form-row">
          <input type="text" id="addSn" placeholder="序列号">
          <input type="text" id="addModel" placeholder="型号">
          <input type="date" id="addDate">
          <button class="btn btn-primary" onclick="addDevice()">添加</button>
        </div>
      </div>
      <div class="card">
        <h3>📋 设备列表</h3>
        <div style="margin-bottom:10px;">
          <button class="btn btn-danger" onclick="clearAllDevices()" style="font-size:12px;">清空全部</button>
        </div>
        <div style="overflow-x:auto;">
          <table id="deviceTable">
            <thead><tr><th>ID</th><th>序列号</th><th>型号</th><th>激活时间</th><th>保修截止</th><th>状态</th><th>操作</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="importTab" class="tab-content">
      <div class="card">
        <h3>📋 CSV / 表格批量导入</h3>
        <p style="color:#666; font-size:13px; margin-bottom:12px;">格式：序列号,型号,激活时间(YYYY-MM-DD)，每行一个，或从Excel复制粘贴</p>
        <textarea id="csvInput" rows="8" placeholder="F2LXV5KQ,iPhone 15 Pro,2025-01-15&#10;G8KM3P2R,iPhone 14,2024-11-03" style="width:100%; padding:12px; border:1px solid #d1d5db; border-radius:8px; font-family:monospace; font-size:14px; resize:vertical;"></textarea>
        <br><br>
        <button class="btn btn-primary" onclick="parseCsvImport()">📥 解析预览</button>
        <div id="csvPreview"></div>
        <button class="btn btn-success" onclick="submitCsvImport()" id="submitCsvBtn" style="display:none; margin-top:15px;">✅ 确认提交到数据库</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type || 'success');
  setTimeout(() => t.className = 'toast', 3000);
}
function getToken() { return localStorage.getItem('admin_token'); }
function escapeHtml(text) {
  const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

async function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  const err = document.getElementById('loginError');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pwd })
    });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('admin_token', data.token);
      document.getElementById('loginPanel').classList.remove('active');
      document.getElementById('mainPanel').classList.add('active');
      err.style.display = 'none';
      loadDevices();
    } else {
      err.style.display = 'block';
    }
  } catch(e) {
    err.style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('admin_token');
  location.reload();
}

if (getToken()) {
  document.getElementById('loginPanel').classList.remove('active');
  document.getElementById('mainPanel').classList.add('active');
  loadDevices();
}

function switchTab(tab) {
  document.getElementById('devicesTab').classList.toggle('active', tab === 'devices');
  document.getElementById('importTab').classList.toggle('active', tab === 'import');
  document.getElementById('tabDevices').classList.toggle('active', tab === 'devices');
  document.getElementById('tabImport').classList.toggle('active', tab === 'import');
}

async function loadDevices() {
  try {
    const res = await fetch('/api/devices', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    const data = await res.json();
    if (!data.ok) return;
    const tbody = document.querySelector('#deviceTable tbody');
    tbody.innerHTML = '';
    data.data.forEach(d => {
      const inWarranty = new Date(d.warranty_end) >= new Date();
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + d.id + '</td>'
        + '<td>' + escapeHtml(d.serial_number) + '</td>'
        + '<td>' + escapeHtml(d.model) + '</td>'
        + '<td>' + escapeHtml(d.activate_time) + '</td>'
        + '<td>' + escapeHtml(d.warranty_end) + '</td>'
        + '<td><span class="badge ' + (inWarranty ? 'ok' : 'no') + '">' + (inWarranty ? '在保' : '过保') + '</span></td>'
        + '<td><button class="btn btn-danger" style="font-size:12px; padding:4px 10px;" onclick="deleteDevice(' + d.id + ')">删除</button></td>';
      tbody.appendChild(tr);
    });
  } catch(e) { console.error(e); }
}

async function addDevice() {
  const sn = document.getElementById('addSn').value.trim().toUpperCase();
  const model = document.getElementById('addModel').value.trim();
  const date = document.getElementById('addDate').value;
  if (!sn || !model || !date) { showToast('请填写完整信息', 'error'); return; }
  try {
    const res = await fetch('/api/devices', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
      body: JSON.stringify({ sn, model, activate_time: date })
    });
    const data = await res.json();
    if (data.ok) {
      showToast('✅ 添加成功', 'success');
      document.getElementById('addSn').value = '';
      document.getElementById('addModel').value = '';
      document.getElementById('addDate').value = '';
      loadDevices();
    } else {
      showToast('❌ 添加失败: ' + (data.error || ''), 'error');
    }
  } catch(e) { showToast('❌ 网络错误', 'error'); }
}

  if (!confirm('确定删除？')) return;
