<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Query · 序列号查询</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  padding: 40px;
  width: 100%;
  max-width: 500px;
}
.card h1 { font-size: 22px; color: #333; margin-bottom: 8px; text-align: center; }
.card .sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 30px; }
.input-group { display: flex; gap: 10px; margin-bottom: 20px; }
.input-group input {
  flex: 1; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 10px;
  font-size: 16px; outline: none; transition: border-color 0.2s;
}
.input-group input:focus { border-color: #667eea; }
.btn {
  padding: 14px 28px; border: none; border-radius: 10px; font-size: 16px;
  cursor: pointer; font-weight: 600;
}
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; width: 100%; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.result { margin-top: 25px; padding: 20px; border-radius: 10px; display: none; }
.result.show { display: block; }
.result.success { background: #f0f9ff; border: 1px solid #bae6fd; }
.result.error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
.result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e0f2fe; }
.result-row:last-child { border-bottom: none; }
.result-row .label { color: #666; font-size: 14px; }
.result-row .value { color: #333; font-weight: 600; font-size: 15px; }
.badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge.ok { background: #dcfce7; color: #16a34a; }
.badge.no { background: #fef2f2; color: #dc2626; }
.footer { text-align: center; margin-top: 20px; }
.footer a { color: #667eea; text-decoration: none; font-size: 14px; }
.footer a:hover { text-decoration: underline; }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 14px 24px; border-radius: 8px; color: #fff; font-weight: 600;
  z-index: 2000; display: none;
}
.toast.show { display: block; }
.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }
</style>
</head>
<body>
<div class="card">
  <h1>🔍 序列号查询</h1>
  <p class="sub">输入设备序列号，查询型号与保修信息</p>
  <div class="input-group">
    <input type="text" id="snInput" placeholder="请输入序列号，如 F2LXV5KQ" autocomplete="off" onkeypress="if(event.key==='Enter')doQuery()">
  </div>
  <button class="btn btn-primary" id="queryBtn" onclick="doQuery()">查 询</button>
  <div class="result" id="resultBox"></div>
  <div class="footer">
    <a href="admin.html">🔐 管理后台</a>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

async function doQuery() {
  const sn = document.getElementById('snInput').value.trim().toUpperCase();
  const box = document.getElementById('resultBox');
  const btn = document.getElementById('queryBtn');
  if (!sn) { showToast('请输入序列号', 'error'); return; }
  btn.disabled = true;
  btn.textContent = '查询中...';
  box.className = 'result';
  try {
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sn })
    });
    const data = await res.json();
    if (data.ok) {
      const d = data.data;
      box.className = 'result show success';
      box.innerHTML = '<div class="result-row"><span class="label">序列号</span><span class="value">' + escapeHtml(sn) + '</span></div>'
        + '<div class="result-row"><span class="label">型号</span><span class="value">' + escapeHtml(d.model) + '</span></div>'
        + '<div class="result-row"><span class="label">激活时间</span><span class="value">' + escapeHtml(d.activate_time) + '</span></div>'
        + '<div class="result-row"><span class="label">保修截止</span><span class="value">' + escapeHtml(d.warranty_end) + '</span></div>'
        + '<div class="result-row"><span class="label">保修状态</span><span class="badge ' + (d.in_warranty ? 'ok' : 'no') + '">' + (d.in_warranty ? '✅ 在保' : '❌ 过保') + '</span></div>';
    } else {
      box.className = 'result show error';
      box.innerHTML = '❌ ' + escapeHtml(data.error || '未查询到该设备');
    }
  } catch (e) {
    box.className = 'result show error';
    box.innerHTML = '❌ 网络错误：' + escapeHtml(e.message);
  }
  btn.disabled = false;
  btn.textContent = '查 询';
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}
</script>
</body>
</html>
