<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>序列号查询</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="box">
  <h2>🔍 序列号查询</h2>
  <form id="form">
    <input id="sn" placeholder="请输入设备序列号" required autofocus>
    <button type="submit">查询</button>
  </form>
  <div id="msg" class="msg"></div>
  <div id="result" class="result" hidden>
    <p>型号：<span id="r-model"></span></p>
    <p>激活时间：<span id="r-act"></span></p>
    <p>保修截止：<span id="r-end"></span></p>
    <p>状态：<span id="r-status"></span></p>
  </div>
  <div class="admin-link"><a href="/admin.html">管理后台</a></div>
</div>
<script src="/app.js"></script>
<script>
document.getElementById('form').onsubmit=async e=>{
  e.preventDefault();
  const sn=document.getElementById('sn').value.trim();
  const msg=document.getElementById('msg');
  hideMsg(msg);
  const res=await post('/api/query',{sn});
  if(!res.ok){showMsg(msg,res.error||'查询失败');return;}
  document.getElementById('r-model').textContent=res.data.model;
  document.getElementById('r-act').textContent=res.data.activate_time;
  document.getElementById('r-end').textContent=res.data.warranty_end;
  document.getElementById('r-status').textContent=res.data.in_warranty?'✅ 在保':'❌ 过保';
  document.getElementById('result').hidden=false;
};
</script>
</body>
</html>
